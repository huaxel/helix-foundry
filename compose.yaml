name: helix-foundry
x-app: &app
  build: .
  image: meridian:local
  restart: unless-stopped
  volumes:
    - foundry-data:/data
    - ${LOCAL_DATA_PATH:-./parquet-mount}:/mnt/parquet:ro
  environment: &env
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run scripts/setup.sh first}
    INTERNAL_KEY: ${INTERNAL_KEY:?Run scripts/setup.sh first}
    AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    HOST: 0.0.0.0
    APP_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3001}
    HELIX_URL: http://helix:8080
    EXECUTOR_URL: http://executor:3002
    EXECUTOR_TIMEOUT_MS: ${EXECUTOR_TIMEOUT_MS:-900000}
    MODEL_ENDPOINT: ${MODEL_ENDPOINT:-http://framearch-juan:8000/v1}
    INLINE_WORKER: "false"
    # Listens on the container network; the port is published on loopback only.
    ALLOW_NETWORK_ACCESS: "true"
    DATA_DIR: /data
    LOCAL_DATA_PATH: /mnt/parquet
    LOCAL_DATA_INCLUDE: "${LOCAL_DATA_INCLUDE:-**/*.parquet}"
  networks: [default, execution]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    helix:
      condition: service_started
services:
  app:
    <<: *app
    mem_limit: 1g
    cpus: 0.75
    environment:
      <<: *env
      NEON_CLIENT_ID: ${NEON_CLIENT_ID:-}
      NEON_CLIENT_SECRET: ${NEON_CLIENT_SECRET:-}
      SUPABASE_CLIENT_ID: ${SUPABASE_CLIENT_ID:-}
      SUPABASE_CLIENT_SECRET: ${SUPABASE_CLIENT_SECRET:-}
      PLANETSCALE_CLIENT_ID: ${PLANETSCALE_CLIENT_ID:-}
      PLANETSCALE_CLIENT_SECRET: ${PLANETSCALE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-3001}:3001"
      # Tailnet access is opt-in: see compose.tailnet.yaml. That overlay adds
      # the Tailscale IP binding and must only be used with AUTH_PASSWORD set
      # and a matching PUBLIC_ORIGIN (the app refuses otherwise).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    mem_limit: 768m
    cpus: 0.5
    command: ["node", "dist/apps/api/src/worker.js"]
  executor:
    <<: *app
    command: ["node", "dist/services/executor/src/server.js"]
    environment:
      INTERNAL_KEY: ${INTERNAL_KEY:?Run scripts/setup.sh first}
      DATA_DIR: /data
      LOCAL_DATA_PATH: /mnt/parquet
      EXECUTOR_TIMEOUT_MS: ${EXECUTOR_TIMEOUT_MS:-900000}
      EXECUTOR_HOST: 0.0.0.0
      EXECUTOR_PORT: 3002
      EXECUTOR_CONCURRENCY: ${EXECUTOR_CONCURRENCY:-1}
      DUCKDB_MEMORY: ${DUCKDB_MEMORY:-768MB}
      DUCKDB_THREADS: ${DUCKDB_THREADS:-1}
      DUCKDB_TEMP_LIMIT: ${DUCKDB_TEMP_LIMIT:-2GB}
      DUCKDB_TEMP_DIR: ${DUCKDB_TEMP_DIR:-/tmp}
      # materialize (default) = existing behavior. Set EXECUTOR_MODE=stream and
      # use compose.stream.yaml for the OS-isolated streaming executor.
      EXECUTOR_MODE: ${EXECUTOR_MODE:-materialize}
      EXECUTOR_SANDBOX_ROOT: ${EXECUTOR_SANDBOX_ROOT:-/tmp/executor-sbx}
    # Ceilings, not reservations. Tunable because the right size depends on the
    # widest tables that get profiled: DuckDB's memory limit is per query, so a
    # container limit that leaves no headroom above DUCKDB_MEMORY forces the
    # profiling fallbacks instead of exact statistics. Raise both together.
    mem_limit: ${EXECUTOR_MEM_LIMIT:-2g}
    cpus: ${EXECUTOR_CPUS:-1.5}
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [execution]
  helix:
    image: ghcr.io/helixdb/helixdb:v0.0.6@sha256:94b29942658ebdca0a91bf15edffe921a46da3e26e1223ea333ccce58c6212dd
    restart: unless-stopped
    environment:
      HELIX_DATA_DIR: /var/lib/helix
    volumes:
      - helix-data:/var/lib/helix
networks:
  execution:
    internal: true
volumes:
  foundry-data:
  helix-data:
